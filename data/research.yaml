    journal: Advanced Functional Materials
    year: 2023
    doi: 10.1002/adfm.202207867
  - title: Formation of hierarchically ordered structures in conductive polymers to enhance the performances of lithium-ion batteries
    journal: Nature Energy
    year: 2023
    doi: 10.1038/s41560-022-01176-6
  - title: 'Cryogenic 4D-STEM analysis of an amorphous-crystalline polymer blend: combined nanocrystalline and amorphous phase mapping'
    journal: iScience
    year: 2022
    doi: 10.1016/j.isci.2022.103882
  - title: Extreme ductility in freestanding polystyrene thin films
    journal: Macromolecules
    year: 2020
    doi: 10.1021/acs.macromol.0c01387
