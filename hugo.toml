# Site configuration. Page text lives in content/, lists (people, papers, news...) in data/.
baseURL = "https://aminor.mse.berkeley.edu/"
locale = "en-US"
title = "Minor Research Group"
disableKinds = ["taxonomy", "term", "section", "rss"]
enableRobotsTXT = true

[params]
  description = "The Minor Research Group at UC Berkeley and Berkeley Lab uses advanced and in situ electron microscopy to study metals, polymers and other materials."
  tagline = "UC Berkeley · Berkeley Lab"
  email = "aminor@berkeley.edu"
  pi = "Prof. Andrew M. Minor"
  scholar = "https://scholar.google.com/citations?user=YsKTazIAAAAJ&hl=en&view_op=list_works&sortby=pubdate"

# Top navigation (also the "Explore" links in the footer).
[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    name = "Research"
    pageRef = "/research"
    weight = 2
  [[menus.main]]
    name = "People"
    pageRef = "/people"
    weight = 3
  [[menus.main]]
    name = "Publications"
    pageRef = "/publications"
    weight = 4
  [[menus.main]]
    name = "News"
    pageRef = "/news"
    weight = 5
  [[menus.main]]
    name = "Gallery"
    pageRef = "/gallery"
    weight = 6
  [[menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 7

[imaging]
  resampleFilter = "Lanczos"
  [imaging.webp]
    quality = 82

[markup.goldmark.renderer]
  unsafe = true   # allow simple inline HTML such as <i> in page text

# Oldest Hugo that builds this site. The deploy workflow pins the exact version.
[module.hugoVersion]
  min = "0.166.0"

# Keep HTML comments when minifying (the only one is the signature in layouts/baseof.html).
[minify.tdewolff.html]
  keepComments = true
