# Builds the site with Hugo and publishes it to GitHub Pages on every push to main.
# Setup once: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0   # keep in sync with hugo.toml [module.hugoVersion]
    steps:
      - name: Install Hugo
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/hugo.tar.gz" hugo
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      - name: Cache resized images
        uses: actions/cache@v6
        with:
          path: resources
          key: hugo-resources-${{ hashFiles('assets/img/**') }}
          restore-keys: hugo-resources-
      - name: Build
        run: '"$RUNNER_TEMP/hugo" --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
